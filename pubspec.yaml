name: loci
description: "A new Flutter project."
publish_to: 'none'
version: 1.9.2+119

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Push Notifications & Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Payments
  flutter_stripe: ^11.1.0

  # Realtime chat
  socket_io_client: ^3.1.2

  # UI & Styling
  cupertino_icons: ^1.0.8
  cupertino_native: ^0.1.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.1
  flutter_svg: ^2.2.3
  carousel_slider: ^5.0.0
  percent_indicator: ^4.2.3
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Networking
  http: ^1.6.0

  # Utils
  uuid: ^4.5.1

  # Auth & Social Login
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # State Management & Navigation
  get: ^4.6.5
  go_router: ^17.1.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  get_storage: ^2.1.1

  # Form & Input
  pinput: ^6.0.1
  intl_phone_field: ^3.2.0
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  file_picker: ^10.3.10

  # Scanner, Hardware & Location
  mobile_scanner: ^7.1.2
  vibration: ^2.0.0
  qr_flutter: ^4.0.0 #genarate qr code
  #qr code download
  screenshot: ^3.0.0
  permission_handler: ^11.3.1
  gal: ^2.3.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0


  # Calendar
  table_calendar: ^3.2.0

  # Utils
  logger: ^2.7.0
  intl: ^0.20.2

  # Code Generation
  flutter_gen: ^5.12.0
  url_launcher: ^6.3.2
  image_cropper: ^12.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.12.0

flutter:
  # image_cropper (TOCropViewController 3.x) and file_picker's
  # DKImagePickerController (TOCropViewController 2.x) conflict under
  # SwiftPM. CocoaPods resolves this via file_picker's PhotoGallery
  # subspec; keep SPM off until those packages align.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf